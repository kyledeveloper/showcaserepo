<!doctype html>
<html lang="zh-CN" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#07111c" />
    <meta name="description" content="个人作品展示厅 — Three.js 时间线画廊：LifeRPG、杯中花、Options Quant Strategy Scanner" />
    <title>个人作品展示厅</title>
    <script type="module" crossorigin src="/showcaserepo/assets/index-DfwdFkMt.js"></script>
    <link rel="stylesheet" crossorigin href="/showcaserepo/assets/index-KSIpNfVv.css">
  </head>
  <body>
    <canvas id="space-canvas" aria-hidden="true"></canvas>
    <div class="noise" aria-hidden="true"></div>

    <div class="progress-line" aria-hidden="true"><span id="progress"></span></div>

    <div class="utility-controls" role="group" data-i18n-aria-label="settings" aria-label="页面设置">
      <button id="language-toggle" type="button">EN</button>
      <button id="theme-toggle" type="button" aria-label="切换到浅色模式"></button>
    </div>

    <header class="gallery-guide is-hidden">
      <div class="gallery-title-row">
        <strong data-i18n="stackHeading">作品画廊</strong>
        <button class="add-project-button" id="add-project-button" type="button">
          <svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M10 4v12M4 10h12" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
          <span data-i18n="addProject">添加项目</span>
        </button>
      </div>
      <span data-i18n="stackHint">滚轮翻页 · 悬停展开</span>
      <span id="stack-counter" aria-live="polite">00 / 04</span>
    </header>

    <nav class="timeline-nav" data-i18n-aria-label="timeline" aria-label="作品时间线">
      <!-- Dots are rendered by src/gallery.js: one per screen (hero + each project). -->
    </nav>

    <main id="app">
      <section class="chapter intro screen-hero is-active" id="screen-hero" data-screen="hero">
        <div class="intro-inner">
          <div>
            <p class="kicker" data-i18n="kicker">精选作品 · 2026</p>
            <h1 data-i18n="heroTitle">把想法，做成能运行的世界。</h1>
            <p class="intro-note" data-i18n="heroNote">四件作品，四种尺度：从日常成长、咖啡记录，到期权研究，再到 AI 智能体技能。向下滚动，沿着时间线逐个进入。</p>
            <div class="intro-cta">
              <button class="project-link" id="start-browsing" type="button" data-i18n="startBrowse">开始浏览作品</button>
            </div>
          </div>
          <button class="scroll-cue" id="scroll-cue" type="button" data-i18n-aria-label="scroll" aria-label="滚动">
            <svg viewBox="0 0 18 28" fill="none" aria-hidden="true">
              <rect x="1" y="1" width="16" height="26" rx="8" stroke-width="1.6" />
              <line x1="9" y1="7" x2="9" y2="12" stroke-width="1.6" stroke-linecap="round" />
            </svg>
            <span data-i18n="scroll">滚动</span>
          </button>
        </div>
      </section>
      <div id="stack"><!-- project chapters are rendered here by src/gallery.js --></div>
    </main>

    <!-- Add-project entry panel: in-page drawer, no navigation. Behavior in src/projectForm.js. -->
    <section class="project-drawer" id="project-drawer" role="dialog" aria-modal="true" aria-labelledby="project-drawer-title" hidden>
      <div class="project-drawer-backdrop" id="project-drawer-backdrop" aria-hidden="true"></div>
      <div class="project-drawer-panel">
        <div class="project-drawer-head">
          <div>
            <h2 id="project-drawer-title" data-i18n="newProjectTitle">添加新项目</h2>
            <p data-i18n="newProjectIntro">粘贴 GitHub 仓库地址，一键拉取项目资料；或切换到手动填写。整个过程留在当前画廊中。</p>
          </div>
          <button class="drawer-close" id="project-drawer-close" type="button" data-i18n-aria-label="closeProjectForm" aria-label="关闭添加项目页面">
            <svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="m5 5 10 10M15 5 5 15" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
          </button>
        </div>

        <div class="source-tabs" role="tablist" data-i18n-aria-label="sourceMethod" aria-label="项目录入方式">
          <button class="source-tab" id="github-source-tab" type="button" role="tab" aria-controls="github-source-panel" aria-selected="true" data-source-mode="github" data-i18n="githubImport">从 GitHub 导入</button>
          <button class="source-tab" id="manual-source-tab" type="button" role="tab" aria-controls="project-form" aria-selected="false" data-source-mode="manual" data-i18n="manualEntry">手动填写</button>
        </div>

        <form class="project-form" id="project-form">
          <div class="form-field full" id="github-source-panel" role="tabpanel" aria-labelledby="github-source-tab">
            <label for="github-url" data-i18n="githubUrlLabel">GitHub 仓库地址</label>
            <div class="github-fetch-row">
              <input id="github-url" name="githubUrl" type="url" inputmode="url" autocomplete="url" placeholder="https://github.com/owner/repository" data-i18n-placeholder="githubUrlPlaceholder" />
              <button class="fetch-button" id="github-fetch-button" type="button" data-i18n="fetchRepoInfo">获取信息</button>
            </div>
            <p class="field-note" data-i18n="githubUrlNote">点击「获取信息」，自动从 GitHub 公开接口拉取名称、简介、主页与技术标签。</p>
            <div class="github-status" id="github-status" role="status" aria-live="polite" data-i18n="githubWaiting">等待输入 GitHub 仓库地址。</div>
          </div>

          <div class="form-row">
            <div class="form-field">
              <label for="project-name" data-i18n="projectNameLabel">项目名称</label>
              <input id="project-name" name="name" type="text" autocomplete="off" required placeholder="例如 LifeRPG" data-i18n-placeholder="projectNamePlaceholder" />
            </div>
            <div class="form-field">
              <label for="project-date" data-i18n="projectDateLabel">项目时间</label>
              <input id="project-date" name="date" type="month" />
            </div>
          </div>

          <div class="form-field full">
            <label for="project-description" data-i18n="projectDescriptionLabel">项目简介</label>
            <textarea id="project-description" name="description" required placeholder="用一两句话介绍它解决的问题和特色" data-i18n-placeholder="projectDescriptionPlaceholder"></textarea>
          </div>

          <div class="form-row">
            <div class="form-field">
              <label for="project-source-url" data-i18n="sourceUrlLabel">源码链接</label>
              <input id="project-source-url" name="sourceUrl" type="url" inputmode="url" autocomplete="url" placeholder="https://github.com/…" data-i18n-placeholder="sourceUrlPlaceholder" />
            </div>
            <div class="form-field">
              <label for="project-website-url" data-i18n="websiteUrlLabel">项目网站（可选）</label>
              <input id="project-website-url" name="websiteUrl" type="url" inputmode="url" autocomplete="url" placeholder="https://…" data-i18n-placeholder="websiteUrlPlaceholder" />
            </div>
          </div>

          <div class="form-field full">
            <label for="project-tags" data-i18n="projectTagsLabel">技术与标签</label>
            <input id="project-tags" name="tags" type="text" autocomplete="off" placeholder="React, TypeScript, Three.js" data-i18n-placeholder="projectTagsPlaceholder" />
            <p class="field-note" data-i18n="projectTagsNote">用逗号分隔，之后会显示在项目卡片上。</p>
          </div>

          <div class="form-actions">
            <span class="form-actions-note" data-i18n="draftOnlyNote">现在先生成本页预览；发布与保存会在账号和后台接入后完成。</span>
            <button class="preview-button" type="submit" data-i18n="previewDraft">预览草稿</button>
          </div>
        </form>

        <article class="draft-preview" id="draft-preview" aria-live="polite" hidden>
          <small data-i18n="draftPreviewLabel">项目卡片预览</small>
          <h3 id="draft-preview-name"></h3>
          <p id="draft-preview-description"></p>
          <div class="draft-links" id="draft-preview-links"></div>
        </article>
      </div>
    </section>

  </body>
</html>
